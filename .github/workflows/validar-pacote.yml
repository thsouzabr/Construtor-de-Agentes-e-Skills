name: Validar pacote de agentes e skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar-estrutura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar validadores
        run: python -m py_compile scripts/validate_skill.py scripts/validate_package.py
      - name: Verificar estrutura e referências internas
        run: python scripts/validate_package.py .
